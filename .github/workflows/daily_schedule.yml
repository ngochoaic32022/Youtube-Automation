name: Daily YouTube Multi-Channel Automation

on:
  schedule:
    # 04:30 UTC = 11:30 GMT+7 (Ca trưa Kênh 1)
    - cron: '30 4 * * *'
    # 11:45 UTC = 18:45 GMT+7 (Ca tối Kênh 1 + Kênh 2/Kênh 3)
    - cron: '45 11 * * *'
  workflow_dispatch: # Cho phép bấm 'Run workflow' thủ công trên web GitHub bất cứ lúc nào

jobs:
  produce_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore OAuth Tokens and Secrets
        env:
          TOKEN_CHANNEL_1: ${{ secrets.TOKEN_CHANNEL_1 }}
          TOKEN_CHANNEL_2: ${{ secrets.TOKEN_CHANNEL_2 }}
          TOKEN_CHANNEL_3: ${{ secrets.TOKEN_CHANNEL_3 }}
          PROXIES_JSON: ${{ secrets.PROXIES_JSON }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python -c "
          import os, json
          mapping = [
              ('TOKEN_CHANNEL_1', 'config/tokens/token_channel_1.json'),
              ('TOKEN_CHANNEL_2', 'config/tokens/token_channel_2.json'),
              ('TOKEN_CHANNEL_3', 'config/tokens/token_channel_3.json'),
              ('PROXIES_JSON', 'config/proxies.json'),
          ]
          for env_name, file_path in mapping:
              val = os.environ.get(env_name, '').strip()
              if val:
                  os.makedirs(os.path.dirname(file_path), exist_ok=True)
                  with open(file_path, 'w', encoding='utf-8') as f:
                      f.write(val)
                  print(f'✅ Successfully restored {file_path}')
              else:
                  print(f'⚠️ Warning: Secret {env_name} is empty or not set')

          pexels_key = os.environ.get('PEXELS_API_KEY', '').strip()
          if pexels_key:
              os.makedirs('config', exist_ok=True)
              with open('config/api_keys.json', 'w', encoding='utf-8') as f:
                  json.dump({'PEXELS_API_KEY': pexels_key}, f)
              print('✅ Successfully restored config/api_keys.json')
          "

      - name: Run Multi-Channel Production Engine
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python core/produce_all_channels_daily.py
